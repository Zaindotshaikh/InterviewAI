[project]
name = "interviewai-agent-v2"
version = "0.1.0"
description = "Indic voice interview agent (LiveKit + Sarvam/OpenAI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "livekit-agents[openai,sarvam,silero,tavus,elevenlabs]>=1.2.0",
  "livekit-plugins-noise-cancellation>=0.2.0",
  "livekit-plugins-ai-coustics>=0.3.0",
  "livekit-plugins-google>=1.2.0",
  "livekit-plugins-elevenlabs>=1.2.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["interview", "providers", "eval"]
py-modules = ["main", "config", "backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
